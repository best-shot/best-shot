packages:
  - packages/*
  - tools/*
  - tests

catalog:
  '@babel/core': ^8.0.5
  browserslist: ^4.28.8
  chalk: ^6.0.0
  cheetor: ^0.13.0
  core-js: ^3.50.0
  core-js-pure: ^3.50.0
  deepmerge-ts: ^8.0.2
  ext-to-regexp: ^0.1.0
  flat: ^6.0.1
  fs-extra: ^11.4.0
  ini: ^7.0.0
  settingz: ^0.2.0
  slash-to-regexp: ^0.2.0
  sort-keys: ^6.0.1
  vue: ~3.5.42
  webpack: ^5.108.4
  yaml: ^2.9.1

catalogs:
  react:
    '@pmmmwh/react-refresh-webpack-plugin': ^0.6.3
    '@types/react': ~18.3.31
    '@types/react-dom': ~18.3.7
    react: ~18.3.1
    react-dom: ~18.3.1
    react-refresh: ^0.18.0

configDependencies:
  pnpm-plugin-nice-move: 0.3.8+sha512-qfxDv6ji7mld08/k6WIFBq1XwFH6KgIKdBoGgvQ4CcOHENt1BlHDI9TALdPVL23vEBmEuon4di7gNBoMGr5RZg==

minimumReleaseAgeExclude:
  - '@into-mini/*'
  - postcss-preset-evergreen
  - babel-preset-evergreen

overrides:
  '@into-mini/sfc-template-traverse': ^0.1.2
  '@into-mini/sfc-transformer': ^0.6.9
  '@into-mini/vue-mini-patch': ^0.4.8
  eslint: ^9.39.5
  sass: '-'

patchedDependencies:
  '@vue-mini/core': .patches/@vue-mini__core.patch
  ava: .patches/ava.patch

shamefullyHoist: true

trustPolicyExclude:
  - semver
  - memfs@4.56.2
  - webpack-dev-middleware@7.4.6

updateConfig:
  ignoreDependencies:
    - express
    - react
    - react-dom
